# Own hard cap instead of the shared batch.slice (batch-slice.conf, added 2026-11-14 machine-wide).
# The posters need ~550 MB for ~30 s, but in batch.slice they queued behind other projects' multi-GB rebuilds:
# when one of those sat at the slice's 4.5 GB ceiling the posters were throttled to a standstill and hit the
# 15-minute timeout (15, 19-21 Nov 2026). A 1 GB cap with no swap keeps the original promise (this job can never
# starve the websites; past 1 GB the kernel kills only this job, and it runs again tomorrow).
[Service]
Slice=app.slice
MemoryHigh=900M
MemoryMax=1G
MemorySwapMax=0
